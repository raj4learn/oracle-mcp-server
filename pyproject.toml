[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-mcp-server"
version = "0.1.0"
description = "Oracle MCP Server for database operations"
readme = "ReadMe.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Rajkumar Oppilamani", email = "raj4learn@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "oracledb>=1.3.1",
    "python-dotenv>=1.0.0",
    "fastmcp==2.6.0",
    "pydantic"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "pydantic"
]

[tool.setuptools]
packages = ["db_data_extractor", "oracle_mcp"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
